name: Family regrouping + combo agreement tests (manual, one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy statsmodels

      - name: 🎯 Run family regrouping (Part 1) + combo agreement tests (Part 2)
        working-directory: analysis
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python family_analysis_and_combo_tests.py

      - name: 📤 Commit and push the generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/family_analysis_and_combo_tests.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Feature-family regrouping + within-family agreement tests (automated)"
          git push origin HEAD:${{ github.ref_name }}
