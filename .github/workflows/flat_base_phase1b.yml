name: Flat Base Phase 1b — 11-stock + 50-stock baseline (manual, one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flat_base:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: 🎯 Run Flat Base Phase 1b (11-stock + 50-stock baseline, one script)
        working-directory: analysis
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python flat_base_phase1b_test.py

      - name: 📤 Commit and push the generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/flat_base_detector_phase1b_results.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Flat Base Phase 1b: 11-stock + 50-stock results (automated)"
          git push origin HEAD:${{ github.ref_name }}
