name: Pre-move fingerprint out-of-sample scan (manual, one-off)

on:
  workflow_dispatch:
    inputs:
      shard:
        description: >
          Optional "i/n" shard selector (e.g. "1/5") to split the full-
          universe scan across multiple runs, keeping each run's printed
          JSON blob under GitHub Actions' per-line log-storage limit.
          Empty runs the full universe in one go.
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: 🔬 Scan full PSX universe for two pre-specified pre-move fingerprints
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          FP_SCAN_SHARD: ${{ inputs.shard }}
        run: python run_fingerprint_scan.py
