name: Verify session outputs (read-only, manual)

# Reads the stored outputs of one session (batch markers, Wyckoff rows,
# volatility scan, combined view, candle freshness, 4-hour availability)
# and prints a report. Writes NOTHING to the database (~300-450 indexed
# row reads). No snapshot step: it needs only one row per symbol.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Session date to verify (YYYY-MM-DD)"
        required: true
      prev:
        description: "Previous session date to compare (YYYY-MM-DD)"
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PSX_TURSO_USAGE_REPORT: "1"
      LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
      LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: 🔎 Verify (read-only)
        working-directory: backend
        run: python verify_session.py --date "${{ inputs.date }}" --prev "${{ inputs.prev }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-verification
          path: session_verification.md
