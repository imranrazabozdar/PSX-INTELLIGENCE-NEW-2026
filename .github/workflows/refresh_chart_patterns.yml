name: Refresh pattern scans (daily after market close)

on:
  schedule:
    # Mon-Thu: 3:35 PM PKT (10:35 UTC)
    - cron: '35 10 * * 1-4'
    # Fri: 4:35 PM PKT (11:35 UTC)
    - cron: '35 11 * * 5'
  # Manual trigger for testing/backfill
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🔍 Detect all pattern families (latest bar only)
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_chart_pattern_refresh.py

      - name: 📊 Show pattern detection results
        working-directory: backend
        if: always()
        run: |
          echo ""
          echo "✅ Pattern scan refresh workflow complete"
          echo ""
          echo "Scans run:"
          echo "  • Bullish Engulfing (candlestick)"
          echo "  • Morning Star (candlestick)"
          echo "  • Inverse H&S / Double Bottom (chart patterns)"
          echo ""
          echo "Results saved to analysis_cache table in Turso"
          echo "so the Streamlit app can display them immediately."
