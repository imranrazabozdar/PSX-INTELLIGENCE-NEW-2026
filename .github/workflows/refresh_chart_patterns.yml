name: Refresh pattern scans (daily after market close)

on:
  schedule:
    # Mon-Thu: 3:35 PM PKT (10:35 UTC)
    - cron: '35 10 * * 1-4'
    # Fri: 4:35 PM PKT (11:35 UTC)
    - cron: '35 11 * * 5'
  # Manual trigger for testing/backfill
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install lxml

      - name: 📥 Refresh daily OHLC data from PSX portal
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_ohlc_refresh.py

      - name: 🔍 Detect all pattern families (latest bar only)
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_chart_pattern_refresh.py

      - name: 📈 Backtest intraday signal accuracy
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_signal_backtest.py

      - name: 📈 Backtest daily pattern accuracy
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_daily_pattern_backtest.py

      - name: 🔁 Backtest MHarris 5-bar reversal
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_mharris_backtest.py

      - name: 📈 Backtest MACD+EMA200 trend resumption
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_macdema_backtest.py

      - name: 📉 Backtest regression-channel triangle squeeze
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_triangle_regression_backtest.py

      - name: 🚀 Backtest level break out
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_level_breakout_backtest.py

      - name: 📊 Summary
        if: always()
        run: |
          echo ""
          echo "✅ Daily refresh workflow complete"
          echo ""
          echo "Step 1: OHLC data refresh from dps.psx.com.pk → Turso"
          echo "Step 2: Pattern scans (Bullish Engulfing, Morning Star, IHS/DB, MHarris, MACD+EMA200, Triangle Squeeze, Level Break Out)"
          echo "        → results saved to analysis_cache in Turso"
          echo "Step 3: Signal accuracy backtest (intraday alerts vs forward returns)"
          echo "Step 4: Daily pattern backtest (walk-forward candlestick/structural pattern accuracy)"
          echo "Step 5: MHarris 5-bar reversal backtest"
          echo "Step 6: MACD+EMA200 trend resumption backtest"
          echo "Step 7: Regression-channel triangle squeeze backtest"
          echo "Step 8: Level break out backtest"
