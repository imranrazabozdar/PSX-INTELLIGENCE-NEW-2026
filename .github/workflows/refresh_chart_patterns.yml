name: Refresh pattern scans (daily after market close)

on:
  schedule:
    # Mon-Fri: 4:30 PM PKT (11:30 UTC), at PSX close -- was two separate
    # entries, Mon-Thu at 3:35 PM PKT (BEFORE the 4:30 PM close, the same
    # before-close bug already fixed in fire_engine_daily_batch.yml's own
    # cron) and Fri at 4:35 PM PKT. Unified to one Mon-Fri entry matching
    # that workflow's new schedule (2026-09-09): this job and the FIRE/
    # Wyckoff batch don't block or wait on each other (separate workflow
    # files, separate jobs), so firing at the same moment is fine -- the
    # old few-minutes stagger was a nice-to-have against simultaneous
    # Turso access, not a functional requirement.
    #
    # Same reliability caveat as fire_engine_daily_batch.yml: GitHub's own
    # schedule trigger has proven unreliable for this repo across three
    # consecutive days (2026-09-07 to 09) -- see that workflow's comment.
    # A Claude Code Remote Routine independently dispatches this workflow
    # (cron '26 11 * * 1-5') as the actual guaranteed trigger; this native
    # cron is a best-effort primary that sometimes beats it to the punch,
    # not the only thing this pipeline depends on.
    - cron: '30 11 * * 1-5'
  # Manual trigger for testing/backfill
  workflow_dispatch:

# Two triggers per weekday (Routine backstop + native cron) may overlap; queue
# rather than run concurrently, and let backend/batch_guard.py turn the later
# one into a no-op once a run for the session has completed.
concurrency:
  group: refresh-chart-patterns
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Each Python step prints its Turso rows read/written (by SQL shape)
      # at exit -- see backend/turso_db.py usage accounting.
      PSX_TURSO_USAGE_REPORT: "1"
      # Written by the snapshot step below; every later step answers its
      # daily_ohlc reads from this file instead of Turso (see
      # backend/snapshot_daily_ohlc.py). Absent -> steps read Turso.
      PSX_DAILY_OHLC_SNAPSHOT: ${{ github.workspace }}/daily_ohlc_snapshot.db

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install lxml

      - name: 🛡️ Run guard (one completed run per session)
        id: guard
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python batch_guard.py check chart_refresh

      - name: 📥 Refresh daily OHLC data (SCS daily bars)
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_ohlc_refresh.py

      - name: 💾 Snapshot daily_ohlc for the steps below
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python snapshot_daily_ohlc.py

      - name: 📅 Trading-calendar check (from the local snapshot, 0 Turso reads)
        id: cal
        if: steps.guard.outputs.skip != 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python batch_guard.py calendar --snapshot "$PSX_DAILY_OHLC_SNAPSHOT" --date "${{ steps.guard.outputs.session }}"

      - name: 🔍 Detect all pattern families (latest bar only)
        if: steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          PSX_SESSION_DATE: ${{ steps.guard.outputs.session }}
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_chart_pattern_refresh.py

      - name: 📈 Backtest intraday signal accuracy
        if: steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_signal_backtest.py

      - name: 📈 Backtest daily pattern accuracy
        if: steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_daily_pattern_backtest.py

      - name: 🔁 Backtest MHarris 5-bar reversal
        if: steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_mharris_backtest.py

      - name: 📈 Backtest MACD+EMA200 trend resumption
        if: steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_macdema_backtest.py

      - name: 📉 Backtest regression-channel triangle squeeze
        if: steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_triangle_regression_backtest.py

      - name: 🚀 Backtest level break out
        if: steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_level_breakout_backtest.py

      - name: 📉 Backtest head and shoulders top
        if: steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_hstop_backtest.py

      - name: 🕯️ Backtest engulfing + star
        if: steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python run_engulfing_star_backtest.py

      - name: ✅ Mark session completed
        if: success() && steps.guard.outputs.skip != 'true' && steps.cal.outputs.trading == 'true'
        working-directory: backend
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python batch_guard.py mark chart_refresh --date "${{ steps.guard.outputs.session }}"

      - name: 📊 Summary
        if: always()
        run: |
          echo ""
          echo "✅ Daily refresh workflow complete"
          echo ""
          echo "Step 1: OHLC data refresh from SCS daily bars → Turso (then a local daily_ohlc snapshot for the steps below)"
          echo "Step 2: Pattern scans (Bullish Engulfing, Morning Star, IHS/DB, MHarris, MACD+EMA200, Triangle Squeeze, Level Break Out, Head & Shoulders Top)"
          echo "        → results saved to analysis_cache in Turso"
          echo "Step 3: Signal accuracy backtest (intraday alerts vs forward returns)"
          echo "Step 4: Daily pattern backtest (walk-forward candlestick/structural pattern accuracy)"
          echo "Step 5: MHarris 5-bar reversal backtest"
          echo "Step 6: MACD+EMA200 trend resumption backtest"
          echo "Step 7: Regression-channel triangle squeeze backtest"
          echo "Step 8: Level break out backtest"
          echo "Step 9: Head and shoulders top backtest"
          echo "Step 10: Engulfing + star backtest"
