name: Phase 1 Triple-Barrier sweep — all indicators (manual, one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy statsmodels

      - name: 🎯 Run Phase 1 Triple-Barrier sweep across all indicators
        working-directory: analysis
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python phase1_all26_sweep.py

      - name: 📤 Commit and push the generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/phase1_all26_triple_barrier_results.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Phase 1 Triple-Barrier sweep results, all indicators (automated)"
          git push origin HEAD:${{ github.ref_name }}
