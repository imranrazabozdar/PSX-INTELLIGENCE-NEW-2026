name: Universe backfill + retention preview

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated tickers to backfill (empty = script default list)"
        required: false
        default: ""
        type: string
      skip_preview:
        description: "Skip the presence check and retention-preview counts (true/false)"
        required: false
        default: "true"
        type: string

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PSX_TURSO_USAGE_REPORT: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pyyaml pandas numpy

      - name: Run backfill and read-only retention preview
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          SYMBOLS: ${{ inputs.symbols }}
          SKIP_PREVIEW: ${{ inputs.skip_preview }}
        run: |
          ARGS=()
          if [ -n "$SYMBOLS" ]; then ARGS+=(--symbols "$SYMBOLS"); fi
          if [ "$SKIP_PREVIEW" = "true" ]; then ARGS+=(--skip-preview); fi
          python analysis/universe_backfill_and_retention_preview.py "${ARGS[@]}"
