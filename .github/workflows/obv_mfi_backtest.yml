name: OBV+MFI setup backtest (manual)

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PSX_TURSO_USAGE_REPORT: "1"
      # One paged copy of daily_ohlc (~160K reads); the backtest then reads
      # this file, not Turso.
      PSX_DAILY_OHLC_SNAPSHOT: ${{ github.workspace }}/daily_ohlc_snapshot.db
      LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
      LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: 💾 Snapshot daily_ohlc
        working-directory: backend
        run: python snapshot_daily_ohlc.py
      - name: 📊 Run OBV+MFI backtest
        working-directory: backend
        run: python run_obv_mfi_backtest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: obv-mfi-backtest-report
          path: obv_mfi_backtest_report.md
