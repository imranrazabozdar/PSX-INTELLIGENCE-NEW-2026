name: Pre-move study data fetch (manual, one-off)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: >
          Optional comma-separated symbol subset (e.g. "AICL,SHFA"). Empty
          runs every symbol in TARGETS. Use this to split a large TARGETS
          list across multiple runs -- a single run's printed JSON blob is
          one long log line, and GitHub Actions truncates the head of a
          log that grows too large, which silently drops the
          ===JSON_START=== marker on a big enough combined payload.
        required: false
        default: ''

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas beautifulsoup4 lxml

      - name: 📡 Fetch OHLC (real PSX portal data)
        env:
          PREMOVE_SYMBOLS: ${{ inputs.symbols }}
        run: python analysis/fetch_premove_data.py
