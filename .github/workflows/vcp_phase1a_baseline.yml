name: VCP Phase 1a — 50-stock false-positive baseline (manual, one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      - name: 🎯 Run VCP 50-stock false-positive baseline
        working-directory: analysis
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python vcp_50stock_baseline.py

      - name: 📊 Rebuild the combined Phase 1a report (11-stock + 50-stock)
        working-directory: analysis
        run: python build_vcp_phase1a_report.py

      - name: 📤 Commit and push the generated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/vcp_50stock_results.json analysis/vcp_detector_phase1a_results.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "VCP Phase 1a: 50-stock baseline + combined report (automated)"
          git push origin HEAD:${{ github.ref_name }}
