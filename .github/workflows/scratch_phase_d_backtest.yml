name: Scratch - Phase D backtest (read-only)
# Lives only on branch scratch/phase-d-backtest; runs on push to it. SELECT-only script.
on:
  push:
    branches: [scratch/phase-d-backtest]
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PSX_TURSO_USAGE_REPORT: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pyyaml pandas numpy
      - name: Backtest
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python scratch/backtest_phase_d.py --repo . --months 18
