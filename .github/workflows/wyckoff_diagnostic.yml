name: Wyckoff historical diagnostic (manual)

# Read-only diagnostic of the existing Wyckoff engine (signal frequency,
# forward returns, upper-circuit capture, missed opportunities). Changes no
# production threshold. daily_ohlc comes from a local snapshot (~165K reads
# once); writes one analysis_cache row.
on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PSX_TURSO_USAGE_REPORT: "1"
      PSX_DAILY_OHLC_SNAPSHOT: ${{ github.workspace }}/daily_ohlc_snapshot.db
      LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
      LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r fire_engine/requirements.txt
      - name: 💾 Snapshot daily_ohlc
        working-directory: backend
        run: python snapshot_daily_ohlc.py
      - name: 🔍 Wyckoff diagnostic
        run: python -m fire_engine.run_wyckoff_diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wyckoff-diagnostic-report
          path: wyckoff_diagnostic_report.md
