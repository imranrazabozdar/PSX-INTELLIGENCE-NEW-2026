name: RESEARCH FAILED ACCUMULATION validation (read-only, no database)

# Read-only validation study. NO secrets: the job cannot reach the production
# database. Inputs from SCS + public KSE-100; output = one report artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r fire_engine/requirements.txt
      - name: 🔒 No database credentials
        run: |
          if [ -n "${LIBSQL_URL}${LIBSQL_AUTH_TOKEN}" ]; then echo "credentials present -- aborting"; exit 1; fi
          echo "No database credentials in this job."
      - name: 🔬 Validation study
        working-directory: backend
        env:
          PYTHONUNBUFFERED: "1"
        run: python research_failed_accumulation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-accumulation-validation
          path: failed_accumulation_validation.md
