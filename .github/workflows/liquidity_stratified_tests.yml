name: Liquidity-stratified Triple-Barrier re-test (manual, one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy statsmodels

      - name: 🎯 Run liquidity-stratified Task 1 + Task 2 test
        working-directory: analysis
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python liquidity_stratified_tests.py

      - name: 📤 Commit and push the generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/liquidity_stratified_results.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Liquidity-stratified Triple-Barrier re-test results (automated)"
          git push origin HEAD:${{ github.ref_name }}
