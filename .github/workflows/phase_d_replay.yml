name: Phase D replay (read-only)

# READ-ONLY dry run of the Phase D Breakout & Shelf Tracker for one symbol
# over a date range: one SELECT from daily_ohlc, then each date evaluated on
# its own last-90-bar window exactly as the daily batch would. Creates no
# table and writes nothing (run_phase_d_tracker.py --replay).
on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Symbol'
        default: 'PASL'
      date_from:
        description: 'From (YYYY-MM-DD)'
        default: '2026-10-01'
      date_to:
        description: 'To (YYYY-MM-DD)'
        default: '2026-11-05'
  push:
    branches: [phase-d-tracker]
    paths:
      - fire_engine/phase_d_detector.py
      - fire_engine/run_phase_d_tracker.py
      - fire_engine/tests/test_phase_d.py
      - phase_d_ui.py
      - .github/workflows/phase_d_replay.yml

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PSX_TURSO_USAGE_REPORT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pyyaml pandas numpy
      - name: Replay (read-only)
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: |
          python fire_engine/run_phase_d_tracker.py --replay PASL --from 2026-10-01 --to 2026-11-05
          python fire_engine/run_phase_d_tracker.py --replay PASL --diagnose --from 2026-10-15 --to 2026-11-05
