name: Watchlist-wide fingerprint clustering (manual, one-off)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy statsmodels scikit-learn

      - name: 🎯 Run watchlist-wide fingerprint clustering + validation
        working-directory: analysis
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: python watchlist_cluster_analysis.py

      - name: 📤 Commit and push the generated report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add analysis/watchlist_cluster_analysis.md
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Watchlist-wide fingerprint clustering + out-of-sample validation results (automated)"
          git push origin HEAD:${{ github.ref_name }}
