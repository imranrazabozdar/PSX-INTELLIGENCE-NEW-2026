name: Probe scstrade.com page structure (manual, one-off, discovery only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🔍 Probe scstrade.com structure
        working-directory: fire_engine
        run: python _probe_scstrade.py

      - name: ✅ Verify production scraper module end-to-end
        working-directory: .
        run: python -m fire_engine._test_scraper
