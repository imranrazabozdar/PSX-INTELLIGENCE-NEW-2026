name: PSX FIRE Engine daily batch (after market close)

on:
  schedule:
    # Mon-Fri: 4:30 PM PKT (11:30 UTC), right at PSX close -- explicit
    # request (2026-09-09) to fire at the close time itself. Was two
    # separate entries (Mon-Thu / Fri) both at 4:40 PM PKT; collapsed to
    # one since they'd become identical in practice, and moved 10 min
    # earlier per that request.
    #
    # IMPORTANT: this native GitHub Actions `schedule:` trigger is NOT
    # the only thing that fires this workflow's data pipeline anymore.
    # Real production evidence over three consecutive days (2026-09-07
    # through 09) showed GitHub's own cron scheduler is unreliable for
    # this repo: Monday it silently never fired at all; Tuesday it fired
    # ~3h37m late (15:17 UTC instead of 11:40 UTC); Wednesday it still
    # hadn't fired over an hour past its slot. Retiming the cron string
    # alone does not fix that -- it's GitHub's own scheduler infrastructure
    # being best-effort, not a bug in this file. The actual fix is a
    # second, independent trigger path: a Claude Code Remote Routine
    # (cron '26 11 * * 1-5', see this repo's operator session) that
    # directly calls the workflow_dispatch API for this workflow (and
    # refresh_chart_patterns.yml) every weekday -- the same dispatch
    # mechanism used throughout this project's development, which has
    # fired instantly and reliably every single time it's been used this
    # week, unlike the native schedule. Running both is intentional
    # redundancy: every step in this pipeline is idempotent (INSERT OR
    # IGNORE / UPSERT throughout), so an occasional double-fire on a day
    # the native cron also happens to work is harmless, just slightly
    # wasteful of CI minutes.
    - cron: '30 11 * * 1-5'
  # Manual trigger for testing/backfill
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD to process (default: yesterday)'
        required: false
        default: ''
      backfill_4h_only:
        description: 'true = run ONLY the ohlcv_4h pre-warm job below (skips FIRE+Wyckoff this dispatch)'
        required: false
        default: 'false'
      backfill_start_date:
        description: 'backfill_4h_only: YYYY-MM-DD, oldest date to cover'
        required: false
        default: ''
      backfill_end_date:
        description: 'backfill_4h_only: YYYY-MM-DD, most recent date to cover'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  fire_batch:
    if: ${{ github.event.inputs.backfill_4h_only != 'true' }}
    runs-on: ubuntu-latest
    # 120, not 60: this job now runs FIRE then Wyckoff back to back, sharing
    # one job-level timeout. The FIRE step alone measured ~21 minutes on
    # its own real production run (2026-09-04, run 34031050189) against the
    # 89-symbol universe; the Wyckoff step adds its own daily+4h fetch and
    # detection pass on top of that in the same job, so 30 was already too
    # tight for both steps combined even before this. The universe grew to
    # 150 symbols (+69%) on 2026-09-06, so 60 no longer has enough headroom
    # either -- 120 keeps a comfortable margin without having measured the
    # new combined runtime yet; tighten it back down once a real run reports
    # actual timing at 150 symbols.
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fire_engine/requirements.txt

      - name: 🔥 Run PSX FIRE Engine daily batch
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        # Must run as `-m fire_engine.run_daily_batch` (a package submodule),
        # not `python fire_engine/run_daily_batch.py` -- the latter only
        # puts fire_engine/ itself on sys.path, not the repo root, so
        # `import fire_engine.config` (an absolute intra-package import)
        # fails with ModuleNotFoundError. -m runs with the repo root (cwd)
        # on sys.path, which is what every fire_engine module assumes.
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m fire_engine.run_daily_batch --date "${{ github.event.inputs.date }}"
          else
            python -m fire_engine.run_daily_batch
          fi

      - name: 📊 Run Wyckoff Institutional Accumulation scan
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        # Runs after the FIRE Engine batch above, against the same
        # universe/exclusion filter and the same shared Turso DB.
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            python -m fire_engine.run_wyckoff_batch --date "${{ github.event.inputs.date }}"
          else
            python -m fire_engine.run_wyckoff_batch
          fi

      - name: 🧹 Prune ohlcv_4h cache (keep last 35 days)
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        # Housekeeping only -- never fails the job. store_4h_data()/
        # backfill_4h.py only ever INSERT/UPSERT into ohlcv_4h, so without
        # this it grows unbounded; daily_ohlc is untouched on purpose (see
        # db_prune_cache.py's module docstring).
        continue-on-error: true
        run: |
          python -m fire_engine.db_prune_cache --retention-days 35

  backfill_4h:
    # Runs standalone, in parallel with fire_batch above -- pre-warms
    # ohlcv_4h for the whole universe over an explicit date range in one
    # dispatch, independent of any in-flight FIRE/Wyckoff run (they don't
    # share a job, so neither blocks or waits on the other).
    if: ${{ github.event.inputs.backfill_4h_only == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fire_engine/requirements.txt

      - name: 📦 Pre-warm ohlcv_4h cache
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python -m fire_engine.backfill_4h \
            --start-date "${{ github.event.inputs.backfill_start_date }}" \
            --end-date "${{ github.event.inputs.backfill_end_date }}"
