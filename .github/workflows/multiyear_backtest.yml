name: Phase D multi-year backtest (read-only)

# Manually started only.
# Runs the read-only analysis scripts against the production daily_ohlc (Turso, via
# LIBSQL_URL / LIBSQL_AUTH_TOKEN). The scripts issue SELECTs only -- no table, scanner
# state or app file is written -- and their CSV outputs are uploaded as a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      audit:
        description: 'Audits to run: CHART_PATTERNS_SANITY (read-only chart-pattern sanity on daily_ohlc only), A (watchlist), B (full market), AB, YTD (2026 year-to-date Phase D audit only), IGNITION_PATTERNS (2026 ignition pattern audit only), BULKOWSKI_PSX (Bulkowski chart-pattern audit on PSX daily_ohlc only), TIGHT_BRACKETS (read-only tight-bracket replay of Bulkowski + Phase D breakouts only), STOPPING_VOLUME (read-only stopping-volume / absorption-in-downtrend audit only), STOP_HUNT_ENTRY (read-only entry-method comparison: Baseline vs limit -3.5% vs sweep & reclaim only), POST_WAR_2025_2026 (read-only post-war setup comparison, entries 2025-06-01..2026-01-31 only)'
        default: 'AB'
      symbols:
        description: 'Optional comma list overriding the Audit A watchlist'
        default: ''

permissions:
  contents: read

concurrency:
  group: multiyear-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PSX_TURSO_USAGE_REPORT: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pyyaml pandas numpy
      - name: Run multi-year audit
        if: github.event.inputs.audit != 'CHART_PATTERNS_SANITY' && github.event.inputs.audit != 'YTD' && github.event.inputs.audit != 'IGNITION_PATTERNS' && github.event.inputs.audit != 'BULKOWSKI_PSX' && github.event.inputs.audit != 'TIGHT_BRACKETS' && github.event.inputs.audit != 'STOPPING_VOLUME' && github.event.inputs.audit != 'STOP_HUNT_ENTRY' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          AUDIT: ${{ github.event.inputs.audit || 'AB' }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          mkdir -p out
          args=(--audit "$AUDIT" --out-dir out)
          if [ -n "$SYMBOLS" ]; then args+=(--symbols "$SYMBOLS"); fi
          python analysis/watchlist_breakout_audit.py "${args[@]}" | tee out/run_log.txt
          echo "===== BEGIN multiyear_watchlist_breakouts.csv"; cat out/multiyear_watchlist_breakouts.csv; echo "===== END"
          echo "===== BEGIN multiyear_tier_summary.csv"; cat out/multiyear_tier_summary.csv; echo "===== END"
      - name: Run three-pillar backtest
        if: github.event.inputs.audit != 'CHART_PATTERNS_SANITY' && github.event.inputs.audit != 'YTD' && github.event.inputs.audit != 'IGNITION_PATTERNS' && github.event.inputs.audit != 'BULKOWSKI_PSX' && github.event.inputs.audit != 'TIGHT_BRACKETS' && github.event.inputs.audit != 'STOPPING_VOLUME' && github.event.inputs.audit != 'STOP_HUNT_ENTRY' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: |
          mkdir -p out
          python analysis/three_pillar_backtest.py --out-dir out
          echo "===== BEGIN three_pillar_summary.csv"; cat out/three_pillar_summary.csv; echo "===== END"
      - name: Run forensic mover study
        if: github.event.inputs.audit != 'CHART_PATTERNS_SANITY' && github.event.inputs.audit != 'YTD' && github.event.inputs.audit != 'IGNITION_PATTERNS' && github.event.inputs.audit != 'BULKOWSKI_PSX' && github.event.inputs.audit != 'TIGHT_BRACKETS' && github.event.inputs.audit != 'STOPPING_VOLUME' && github.event.inputs.audit != 'STOP_HUNT_ENTRY' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: |
          mkdir -p out
          python analysis/forensic_mover_study.py --out-dir out
          echo "===== BEGIN forensic_mover_summary.csv"; cat out/forensic_mover_summary.csv; echo "===== END"
      - name: Run Phase D filter ablation
        if: github.event.inputs.audit != 'CHART_PATTERNS_SANITY' && github.event.inputs.audit != 'YTD' && github.event.inputs.audit != 'IGNITION_PATTERNS' && github.event.inputs.audit != 'BULKOWSKI_PSX' && github.event.inputs.audit != 'TIGHT_BRACKETS' && github.event.inputs.audit != 'STOPPING_VOLUME' && github.event.inputs.audit != 'STOP_HUNT_ENTRY' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
        run: |
          mkdir -p out
          python analysis/phase_d_filter_ablation.py --out-dir out
          echo "===== BEGIN phase_d_ablation_summary.csv"; cat out/phase_d_ablation_summary.csv; echo "===== END"
      - name: Phase D YTD audit (read-only)
        if: github.event.inputs.audit == 'YTD' && github.event.inputs.audit != 'STOPPING_VOLUME' && github.event.inputs.audit != 'STOP_HUNT_ENTRY' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PSX_TURSO_USAGE_REPORT: "1"
        run: |
          mkdir -p out
          python analysis/phase_d_ytd_audit.py --out-dir out
          cat out/phase_d_ytd_report.txt
      - name: Ignition patterns audit (read-only)
        if: github.event.inputs.audit == 'IGNITION_PATTERNS' && github.event.inputs.audit != 'STOPPING_VOLUME' && github.event.inputs.audit != 'STOP_HUNT_ENTRY' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PSX_TURSO_USAGE_REPORT: "1"
        run: |
          mkdir -p out && python analysis/ignition_patterns_audit.py --out-dir out && cat out/ignition_patterns_report.txt
      - name: Bulkowski PSX pattern audit (read-only)
        if: github.event.inputs.audit == 'BULKOWSKI_PSX' && github.event.inputs.audit != 'STOPPING_VOLUME' && github.event.inputs.audit != 'STOP_HUNT_ENTRY' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PSX_TURSO_USAGE_REPORT: "1"
        run: |
          mkdir -p out && python analysis/bulkowski_psx_audit.py --out-dir out && cat out/bulkowski_psx_report.txt
      - name: Tight-bracket replay (read-only)
        if: github.event.inputs.audit == 'TIGHT_BRACKETS' && github.event.inputs.audit != 'STOPPING_VOLUME' && github.event.inputs.audit != 'STOP_HUNT_ENTRY' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PSX_TURSO_USAGE_REPORT: "1"
        run: |
          mkdir -p out && python analysis/tight_bracket_replay.py --out-dir out && cat out/tight_bracket_report.txt
      - name: Stopping-volume audit (read-only)
        if: github.event.inputs.audit == 'STOPPING_VOLUME' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PSX_TURSO_USAGE_REPORT: "1"
        run: |
          mkdir -p out && python analysis/stopping_volume_audit.py --out-dir out && cat out/stopping_volume_report.txt
      - name: Stop-hunt entry audit (read-only)
        if: github.event.inputs.audit == 'STOP_HUNT_ENTRY' && github.event.inputs.audit != 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PSX_TURSO_USAGE_REPORT: "1"
        run: |
          mkdir -p out && python analysis/stop_hunt_entry_audit.py --out-dir out && cat out/stop_hunt_report.txt
      - name: Post-war setup comparison audit (read-only)
        if: github.event.inputs.audit == 'POST_WAR_2025_2026'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PSX_TURSO_USAGE_REPORT: "1"
        run: |
          mkdir -p out && python analysis/post_war_regime_audit.py --out-dir out && cat out/post_war_report.txt
      - name: Chart-pattern sanity on daily_ohlc (read-only)
        if: github.event.inputs.audit == 'CHART_PATTERNS_SANITY'
        env:
          LIBSQL_URL: ${{ secrets.LIBSQL_URL }}
          LIBSQL_AUTH_TOKEN: ${{ secrets.LIBSQL_AUTH_TOKEN }}
          PSX_TURSO_USAGE_REPORT: "1"
        run: |
          mkdir -p out && python analysis/chart_patterns_sanity.py --out-dir out && cat out/chart_patterns_sanity.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multiyear-backtest-${{ github.run_id }}
          path: out/
