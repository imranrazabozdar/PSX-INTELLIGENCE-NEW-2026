[server]
# When deploying on Streamlit Cloud or remote environments, the platform
# overrides this address. For local dev, set PSX_ADMIN_TOKEN on the backend
# if untrusted users can reach the Streamlit UI — the backend's admin-token
# gate is the real security boundary, not the listen address.
address = "0.0.0.0"

[theme]
base = "dark"
primaryColor = "#14D9B0"
backgroundColor = "#0A0D11"
secondaryBackgroundColor = "#141922"
textColor = "#E8ECEF"
font = "sans serif"

[client]
toolbarMode = "minimal"

[logger]
level = "error"
